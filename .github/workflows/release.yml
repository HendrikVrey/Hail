name: Release

# Builds Hail-Setup.exe and publishes it. Two channels, one pipeline, because the only thing
# that differs between them is which release the artefact lands in.
#
#   push to master   ->  the rolling "latest" prerelease, force-replaced every time, so the
#                        download link is always the newest build of master
#   push of a v* tag ->  a stable, draft release at that version, kept for ever
#
# The two are addressed by different permanent URLs, and the difference is not arbitrary.
# GitHub's /releases/latest/ deliberately skips prereleases, so it can never serve the rolling
# build; the rolling build is reached through its fixed tag instead:
#
#   .../releases/download/latest/Hail-Setup.exe        newest build of master
#   .../releases/latest/download/Hail-Setup.exe        newest versioned release
#
# Hail's own update check reads releases/latest, so only a published stable release is ever
# offered to users; the rolling build never is.
#
# Neither channel publishes anything unless the tests pass. A red suite leaves the previous
# installer in place rather than replacing it with a broken one.
#
# There is no signing certificate, so Hail-Setup.exe is unsigned and SmartScreen will warn
# about it. The README says so plainly.
#
# This is Etch's, Sling's and Drift's pipeline, with Drift's corrections (the release action
# pinned to a commit, build and test as separate steps) and a self-contained folder per
# architecture rather than a single file: Hail loads plugins, and a folder keeps the
# framework's assemblies where a plugin's dependency resolution expects them.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
    # Pushes that cannot change the installer do not rebuild it. LICENSE and
    # THIRD-PARTY-NOTICES.md ship inside it, so they are not excluded. GitHub skips path
    # filters for tag pushes, so a v* tag always releases.
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".gitignore"
      - ".editorconfig"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v. Publishes a draft release."
        required: true

permissions:
  contents: write

# Two merges in quick succession must not race to replace the same release. The older run is
# cancelled rather than queued: its output would be stale the moment the newer one finished.
#
# A manual run has a group of its own, so a push to master cannot cancel a release half way.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # No token left in .git/config: the build and the tests run code that has no need of it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Everything channel-specific is decided here and nowhere else, so the rest of the
      # pipeline is identical for a rolling build and for a tagged release.
      - name: Decide the channel and the version
        id: channel
        shell: pwsh
        # The manual input arrives through the environment rather than being pasted into the
        # script text, where a value containing a quote would end the literal and run whatever
        # followed.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Directory.Build.props is the single source of truth for the base version.
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<VersionPrefix>([^<]+)</VersionPrefix>') {
            throw 'No <VersionPrefix> in Directory.Build.props.'
          }
          $base = $Matches[1].Trim()

          if ("$env:GITHUB_REF" -like 'refs/tags/v*') {
            $channel  = 'stable'
            $version  = "$env:GITHUB_REF" -replace '^refs/tags/v', ''
            $tag      = "v$version"
            $title    = "Hail $version"
            $pre      = 'false'
            $draft    = 'true'
          }
          elseif ("$env:GITHUB_EVENT_NAME" -eq 'workflow_dispatch') {
            $channel  = 'stable'
            $version  = $env:INPUT_VERSION
            $tag      = "v$version"
            $title    = "Hail $version"
            $pre      = 'false'
            $draft    = 'true'
          }
          else {
            # The rolling build. The run number makes it monotonic so Windows treats a newer
            # build as an upgrade.
            $channel  = 'latest'
            $version  = "$base-dev.$env:GITHUB_RUN_NUMBER"
            $tag      = 'latest'
            $title    = "Hail $version (latest build of master)"
            $pre      = 'true'
            $draft    = 'false'
          }

          if (-not $version) { throw 'No version could be determined.' }

          # A v1.1.0-rc.1 tag is a prerelease: published as stable, releases/latest would serve
          # it, and Hail's update check would offer it to everyone.
          if ($channel -eq 'stable' -and $version.Contains('-')) { $pre = 'true' }

          # Validate the WHOLE version. It is interpolated into run: script bodies further
          # down, and a workflow expression is pasted as text before any shell sees it, so
          # this is the one place worth guarding. The pattern admits a semantic version and
          # nothing else: no quotes, no semicolons, no whitespace, no newline.
          #
          # Do not write an empty expression in a comment here to name the syntax: GitHub
          # parses expression delimiters everywhere in the file, comments inside run: blocks
          # included, and an empty one rejects the whole workflow with no annotation.
          if ($version -notmatch '^\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "Refusing to build version '$version': it is not a plain semantic version."
          }

          # Inno Setup's VersionInfoVersion must be strictly numeric (x.y.z[.w]).
          $numeric = if ($channel -eq 'latest') { "$base.$env:GITHUB_RUN_NUMBER" }
                     else { ($version -split '[-+]')[0] }

          if ($numeric -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Cannot derive a numeric version from '$version'."
          }

          "channel=$channel"   >> $env:GITHUB_OUTPUT
          "version=$version"   >> $env:GITHUB_OUTPUT
          "numeric=$numeric"   >> $env:GITHUB_OUTPUT
          "tag=$tag"           >> $env:GITHUB_OUTPUT
          "title=$title"       >> $env:GITHUB_OUTPUT
          "prerelease=$pre"    >> $env:GITHUB_OUTPUT
          "draft=$draft"       >> $env:GITHUB_OUTPUT

          Write-Host "channel=$channel version=$version numeric=$numeric tag=$tag"

      - name: Restore
        run: dotnet restore Hail.slnx

      # Two steps rather than one script: in pwsh a native command's failure does not stop
      # the script, so one step running both would report a failed build as a test error.
      - name: Build
        run: dotnet build Hail.slnx -c Release --no-restore

      # The gate. Nothing below runs if the suite is red.
      - name: Test
        run: dotnet test Hail.slnx -c Release --no-build

      # A self-contained folder per architecture, ReadyToRun so the first summon after sign-in
      # is not spent compiling. Not trimmed: WPF resolves types by reflection, and plugins
      # need the whole framework to be there.
      - name: Publish win-x64
        run: >
          dotnet publish src/Hail.App/Hail.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.channel.outputs.version }}
          -o publish/win-x64

      - name: Publish win-arm64
        run: >
          dotnet publish src/Hail.App/Hail.App.csproj
          -c Release -r win-arm64 --self-contained true
          -p:PublishReadyToRun=true
          -p:Version=${{ steps.channel.outputs.version }}
          -o publish/win-arm64

      # windows-latest ships Inno Setup today; this pins its presence rather than depending on
      # the runner image staying that way.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: >
          iscc installer\Hail.iss
          /DAppVersion=${{ steps.channel.outputs.version }}
          /DNumericVersion=${{ steps.channel.outputs.numeric }}

      # The rolling build replaces its release outright. gh has no atomic "move a tag and
      # replace its assets", so the old release and tag are deleted and recreated at this
      # commit, which leaves a few seconds where the download 404s.
      - name: Replace the rolling release
        if: steps.channel.outputs.channel == 'latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the previous latest release.' }
          }

          $notes = @"
          The newest build of ``master``, rebuilt on every merge. Unsigned, so SmartScreen
          will warn; see the README. Hail's own update check never offers this build.

          Built from ``$env:GITHUB_SHA``.

          For a fixed, reproducible build, use a versioned release instead.
          "@

          gh release create latest dist/Hail-Setup.exe `
            --prerelease `
            --target "$env:GITHUB_SHA" `
            --title "${{ steps.channel.outputs.title }}" `
            --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the latest release.' }

      # Pinned to a commit rather than a moving tag: this step runs with contents:write and
      # handles the asset people download. The comment names the release the commit is.
      - name: Publish the versioned release
        if: steps.channel.outputs.channel == 'stable'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          # The commit that was built: for a manual run the tag does not exist yet, and would
          # otherwise be made on whatever the default branch points at when the draft is published.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.channel.outputs.title }}
          draft: ${{ steps.channel.outputs.draft }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: dist/Hail-Setup.exe
